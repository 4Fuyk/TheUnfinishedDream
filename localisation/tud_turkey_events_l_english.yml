l_english:
 tud_events.1.t:0 "The Fall of Enver Pasha"
 tud_events.1.d:0 "News reaches Ankara: the Turanian Empire that Enver Pasha built in the ashes of the Russian Civil War has collapsed. Central Asia has shattered into a patchwork of warlords, revolutionaries, and old comrades from the days of the Special Organization. Which side will Turkey take?"
 tud_events.1.a:0 "Support the Turanists"
 tud_events.1.b:0 "Stay Out of It"
