l_english:
 tud_events.1.t:0 "The Fall of Enver Pasha"
 tud_events.1.d:0 "News reaches Ankara: the Turanian Empire that Enver Pasha built in the ashes of the Russian Civil War has collapsed. Central Asia has shattered into a patchwork of warlords, revolutionaries, and old comrades from the days of the Special Organization. The government must decide how closely to watch the unfolding chaos in the east."
 tud_events.1.a:0 "We cannot forget Turan"
 tud_events.1.b:0 "Our future lies elsewhere"
