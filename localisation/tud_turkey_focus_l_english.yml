l_english:
 TUR_dogudaki_golgeler:0 "Shadows in the East"
 TUR_dogudaki_golgeler_desc:0 "Russia's collapse and the power vacuum left across Central Asia force Ankara to look eastward once more. Old ambitions, and old comrades, stir in the ruins of the fallen Turanian order."
 TUR_eski_yoldaslar_yeni_tehditler:0 "Old Comrades, New Threats"
 TUR_eski_yoldaslar_yeni_tehditler_desc:0 "Word reaches Ankara that Esref Kuscubasi, once Enver Pasha's right hand in the Special Organization, now leads a shadow network out of the Pamir mountains. Turkey stands at a crossroads: embrace the old dream of Turan, or turn firmly away from it."
 TUR_ortulu_odenekler:0 "Covert Appropriations"
 TUR_ortulu_odenekler_desc:0 "Setting aside old grievances in the name of the Turanic ideal, the state quietly opens covert funds to arm Kuscubasi's network with rifles and equipment smuggled east."
 TUR_asyada_kurtulus_savasi:0 "A War of Liberation in Asia"
 TUR_asyada_kurtulus_savasi_desc:0 "Under the slogan of a new War of Independence fought in Asia, Turkish volunteers begin slipping across the border to join the forces gathering in the Pamirs."
 TUR_enver_mirasini_kabul:0 "Reclaiming Enver's Legacy"
 TUR_enver_mirasini_kabul_desc:0 "The government makes peace with its domestic critics and officially rehabilitates Enver Pasha's memory. In recognition of his service, Esref Kuscubasi is welcomed into the Turkish military as a Field Marshal."
 TUR_turk_islam_ekseni:0 "The Turkic-Islamic Axis"
 TUR_turk_islam_ekseni_desc:0 "Turkey, Azerbaijan, and Kuscubasi's forces bind themselves together into a new Turkic-Islamic Axis, declaring total war on what remains of the fractured Russian state."
 TUR_kuscubasi_temizligi:0 "No Room for Adventurism"
 TUR_kuscubasi_temizligi_desc:0 "The government in Ankara concludes that new foreign adventures can only bring disaster. A sharp crackdown is launched against Kuscubasi's agents operating within Turkey's own borders."
 TUR_demokrasi_tercih:0 "Peace at Home, Peace in the World"
 TUR_demokrasi_tercih_desc:0 "Rather than militarism, Ankara chooses the path of democracy, holding fast to the principle of Peace at Home, Peace in the World."
 TUR_turkistan_tani:0 "Recognize the Turkestan Democratic Republic"
 TUR_turkistan_tani_desc:0 "Turkey recognizes Mustafa Chokay's Tashkent government as the legitimate authority in the region and extends it a guarantee of independence, standing against both the militarists and the Soviets."
 TUR_kafkas_kaleleri:0 "Fortify the Caucasus Frontier"
 TUR_kafkas_kaleleri_desc:0 "Fortresses rise along the Caucasus border to secure Azerbaijan's oil fields against both the Soviet remnants and Kuscubasi's ambitions. A special defensive pact is struck with the legitimate Azerbaijani national movement."
 TUR_genisletilmis_sadabat:0 "The Expanded Sadabad Pact"
 TUR_genisletilmis_sadabat_desc:0 "Together with allies across the Middle East and the democrats of Central Asia, Turkey forms an Expanded Sadabad Pact, securing a just cause for war to erase Kuscubasi's radical threat from the map."
